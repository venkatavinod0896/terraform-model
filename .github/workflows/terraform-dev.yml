name: Terraform CI/CD

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------
      # Step 1: Bootstrap backend
      # ---------------------------
      - name: Terraform Bootstrap Init & Apply
        working-directory: ./environment/global/backend-bootstrap
        run: |
          terraform init
          terraform apply -auto-approve

      # ---------------------------
      # Step 2: Deploy dev environment
      # ---------------------------
      - name: Terraform Dev Init & Apply
        working-directory: ./environment/dev
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      # ---------------------------
      # Step 3: (Optional) Deploy prod environment
      # ---------------------------
      # - name: Terraform Prod Init & Apply
      #   working-directory: ./environment/prod
      #   run: |
      #     terraform init
      #     terraform plan -out=tfplan
      #     terraform apply -auto-approve tfplan
