name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-1          # Change to your region
      TF_BUCKET: vinod-terraform-state-bucket-0897
      TF_DDB_TABLE: vinod-terraform-lock-table

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7   # Adjust to your version

      - name: Bootstrap S3 Bucket
        run: |
          echo "Checking if S3 bucket $TF_BUCKET exists..."
          if ! aws s3 ls "s3://$TF_BUCKET" >/dev/null 2>&1; then
            echo "Bucket does not exist. Creating..."
            aws s3 mb "s3://$TF_BUCKET" --region $AWS_REGION
          else
            echo "Bucket already exists."
          fi

      - name: Bootstrap DynamoDB Lock Table
        run: |
          echo "Checking if DynamoDB table $TF_DDB_TABLE exists..."
          if ! aws dynamodb describe-table --table-name $TF_DDB_TABLE >/dev/null 2>&1; then
            echo "Table does not exist. Creating..."
            aws dynamodb create-table \
              --table-name $TF_DDB_TABLE \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region $AWS_REGION
            echo "Waiting for table to become ACTIVE..."
            aws dynamodb wait table-exists --table-name $TF_DDB_TABLE --region $AWS_REGION
          else
            echo "Table already exists."
          fi

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Optional Apply step (only on main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
